name: flutter_app
description: "A new Flutter project."
publish_to: "none"
version: 0.0.1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  internal_application:
    path: ../../packages/application
  internal_design_theme:
    path: ../../packages/design_theme
  internal_design_ui:
    path: ../../packages/design_ui
  internal_domain_logic:
    path: ../../packages/domain_logic
  internal_domain_model:
    path: ../../packages/domain_model
  internal_infrastructure:
    path: ../../packages/infrastructure
  internal_shared:
    path: ../../packages/shared
  internal_util_ui:
    path: ../../packages/util_ui
  intl: ^0.20.3
  package_info_plus: ^8.3.1
  pub_semver: ^2.2.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  go_router_builder: ^4.5.0
  # デバッグ機能はリリースビルドに含めないため dev_dependencies に定義する。
  # lib/debug/debug_features_impl.dart 以外から参照しないこと。
  internal_debug:
    path: ../../packages/debug
  riverpod_generator: ^4.0.9
  talker_flutter: ^5.0.0
  talker_riverpod_logger: ^5.1.20

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/yumemi_logo.png

flutter_launcher_icons:
  android: true
  ios: true
