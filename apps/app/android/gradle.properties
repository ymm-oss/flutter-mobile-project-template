org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# サポートライブラリ（com.android.support）に依存するライブラリを使う場合は、次の行のコメントを外す。
# android.enableJetifier=true
# AGP の built-in Kotlin を使う。この行を消すと Flutter の migrator が false を書き戻すため、true を明示する。
# built-in Kotlin に未対応のプラグイン（kotlin-android を無条件に適用するもの）を使う場合は false に戻す。
android.builtInKotlin=true
# Flutter Gradle Plugin が新しい DSL に対応するまで false のままにする。
android.newDsl=false
