name: internal_design_ui
description: 共通UIコンポーネントおよび文言リソースを一元管理するデザインUIパッケージです。
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_gen_runner: ^5.11.0
  internal_design_theme:
    path: ../design_theme
  slang: ^4.8.1
  slang_flutter: ^4.8.0

dev_dependencies:
  build_runner: ^2.5.4
  flutter_test:
    sdk: flutter
  slang_build_runner: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - res/assets/
