name: internal_design_theme
description: アプリ全体で利用されるカラーパレットやタイポグラフィなど、デザインテーマを定義するパッケージです。
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  theme_extensions_builder_annotation: ^7.5.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  theme_extensions_builder: ^7.5.0

flutter:
  uses-material-design: true
