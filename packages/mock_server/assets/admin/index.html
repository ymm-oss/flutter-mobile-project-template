<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>モックサーバーの管理画面</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <header>
      <h1>モックサーバー</h1>
      <nav>
        <button type="button" class="tab" data-tab="operations" aria-current="page">operation</button>
        <button type="button" class="tab" data-tab="traffic">通信</button>
      </nav>
      <div id="operation-actions">
        <label>
          プロファイル
          <select id="profile-select"></select>
        </label>
        <button type="button" id="profile-apply">適用</button>
        <button type="button" id="profile-save">今の設定を保存</button>
        <button type="button" id="profile-delete">削除</button>
        <button type="button" id="reset-all">すべて既定に戻す</button>
      </div>
    </header>
    <p id="status" role="status"></p>
    <main id="tab-operations">
      <section aria-label="operation の一覧">
        <ul id="operations"></ul>
      </section>
      <section id="editor" aria-label="operation の設定" hidden>
        <h2 id="editor-title"></h2>
        <form id="settings-form">
          <fieldset>
            <legend>応答</legend>
            <label>
              <input type="radio" name="kind" value="success" checked />
              正常系
            </label>
            <label>
              <input type="radio" name="kind" value="error" />
              異常系
            </label>
            <div class="options">
              <label>
                ステータスコード
                <select id="status-select"></select>
              </label>
              <label id="custom-status-label">
                そのほかのステータスコード
                <input type="number" id="response-status" required />
              </label>
              <label>
                Content-Type
                <input type="text" id="response-content-type" />
              </label>
              <label>
                本文
                <textarea id="response-body" rows="12" spellcheck="false"></textarea>
              </label>
            </div>
          </fieldset>
          <fieldset>
            <legend>遅延</legend>
            <label>
              <input type="number" id="delay" min="0" value="0" />
              ミリ秒
            </label>
          </fieldset>
          <div class="actions">
            <button type="submit">保存</button>
            <button type="button" id="reset">既定に戻す</button>
          </div>
        </form>
      </section>
    </main>
    <main id="tab-traffic" hidden>
      <section aria-label="通信の一覧">
        <div class="actions">
          <button type="button" id="traffic-pause" aria-pressed="false">一時停止</button>
          <button type="button" id="traffic-clear">履歴を消す</button>
        </div>
        <p id="traffic-empty">まだリクエストを受けていません。</p>
        <ul id="traffic-list"></ul>
      </section>
      <section id="traffic-detail" aria-label="通信の中身" hidden>
        <h2 id="traffic-title"></h2>
        <p id="traffic-meta"></p>
        <button type="button" id="traffic-operation" hidden>この operation の設定を開く</button>
        <h3>リクエスト</h3>
        <pre id="traffic-request-headers"></pre>
        <pre id="traffic-request-body"></pre>
        <h3>応答</h3>
        <pre id="traffic-response-headers"></pre>
        <pre id="traffic-response-body"></pre>
      </section>
    </main>
    <script src="admin.js"></script>
    <script src="traffic.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
