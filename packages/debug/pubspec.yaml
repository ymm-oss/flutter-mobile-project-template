name: internal_debug
description: "This package provides features for Debug Mode"
publish_to: "none"
version: 0.0.1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

resolution: workspace

dependencies:
  accessibility_tools: ^2.6.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  internal_util_ui:
    path: ../util_ui
  path: ^1.9.1
  riverpod_annotation: ^4.0.7
  # 2.2.0 以降は Android で AGP 9 と built-in Kotlin が必要なため 2.1 系に留める（#671 で上限を外す）
  shake_gesture: ">=2.1.0 <2.2.0"
  talker_flutter: ^5.0.0

dev_dependencies:
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
