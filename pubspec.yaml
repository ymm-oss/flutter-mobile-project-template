name: template_workspace
environment:
  sdk: ^3.13.0

workspace:
  # apps
  - apps/app
  - apps/catalog
  # packages
  - packages/application
  - packages/debug
  - packages/design_theme
  - packages/design_ui
  - packages/domain_logic
  - packages/domain_model
  - packages/infrastructure
  - packages/shared
  - packages/util_logic
  - packages/util_ui
  # samples
  - samples/github_app
  - samples/webview
  # utils
  - packages/utils/pagination

dev_dependencies:
  melos: ^8.10.0
  path: ^1.9.1
  yaml: ^3.1.3
  yaml_edit: ^2.2.2
  yumemi_lints: ^4.5.1

dependency_overrides:
  # flutter_launcher_icons が cli_util ^0.4.1 に依存しており melos 8 と解決できないため上書きする
  # https://github.com/fluttercommunity/flutter_launcher_icons/issues/675
  cli_util: ^0.6.0
  file: ^7.0.1
  path: ^1.9.1

melos:
  ide:
    intellij:
      # Disabling IntelliJ's automatic configuration.
      # This is to support different build configurations for environments.
      enabled: false

  command:
    bootstrap:
      environment:
        sdk: ^3.13.0
        flutter: ^3.47.0
      dependencies:
        dio: ^5.9.0
        flutter_hooks: ^0.21.3+1
        flutter_riverpod: ^3.4.3
        freezed_annotation: ^3.1.0
        hooks_riverpod: ^3.4.3
        intl: ^0.20.3
        json_annotation: ^4.12.0
        riverpod_annotation: ^4.0.7
        simple_logger: ^1.10.0
        go_router: ^17.5.0
        package_info_plus: ^8.3.1
        path: ^1.9.1
        shared_preferences: ^2.5.3
        theme_extensions_builder_annotation: ^7.5.0
        visibility_detector: ^0.4.0+2
      dev_dependencies:
        build_runner: ^2.16.1
        flutter_launcher_icons: ^0.14.4
        flutter_test:
          sdk: flutter
        freezed: ^4.0.1
        go_router_builder: ^4.5.0
        json_serializable: ^6.14.1
        riverpod_generator: ^4.0.9
        yumemi_lints: ^4.5.1
        test: ^1.31.1
        theme_extensions_builder: ^7.5.0
        flutter_gen_runner: ^5.15.0
      hooks:
        post: dart run melos run bootstrap:post

  scripts:
    # bootstrap 後に実行する script 群
    bootstrap:post:
      description: bootstrap post hooks
      steps:
        - update:yumemi_lints
        - gen:labeler
        - gen:labels

    check:debug_tree_shaking:
      description: |
        リリースビルドにデバッグ機能が含まれていないこと（tree shaking されていること）を確認します。
        `flutter build apk --analyze-size` と同じ AOT スナップショットを生成して検査します。
      run: bash "$MELOS_ROOT_PATH/scripts/check-debug-tree-shaking.sh"

    fix:
      description: |
        すべてのパッケージに `dart fix --apply` を実行します。
        analyze の対象として開発者が気づけるようにしつつ fix からは対象外とするため独自実装です。
      run: bash "$MELOS_ROOT_PATH/scripts/fix.sh"

    format:
      description: |
        すべてのパッケージに `dart format` を実行します。
        自動生成されたコードは対象外になるように設定しています。
      exec: >-
        find lib -name "*.dart"
        -not -path "*/gen/*"
        -not -name "*.g.dart"
        -not -name "*.freezed.dart"
        -not -name "*.gen.dart"
        -not -name "*.g.theme.dart" | xargs dart format
      packageFilters:
        dirExists: lib
    format:check:
      description: |
        すべてのパッケージに `dart format --output=none --set-exit-if-changed` を実行します。
        自動生成されたコードは対象外になるように設定しています。
      exec: >-
        find lib -name "*.dart"
        -not -path "*/gen/*"
        -not -name "*.g.dart"
        -not -name "*.freezed.dart"
        -not -name "*.gen.dart"
        -not -name "*.g.theme.dart" | xargs dart format --output=none --set-exit-if-changed
      packageFilters:
        dirExists: lib

    gen:
      description: build_runner と i18n の生成コマンドを実行します。
      steps:
        - gen:i18n
        - gen:build
    gen:diff:main:
      description: main ブランチと差分のあるパッケージのみ build_runner と i18n の生成コマンドを実行します。
      steps:
        - gen:i18n:diff:main
        - gen:build:diff:main
    gen:build:
      description: build_runner を使用してコードを生成します。
      exec:
        command: dart run build_runner build
        orderDependents: true
      packageFilters:
        dependsOn: build_runner
    gen:i18n:
      description: 多言語対応のためのローカライゼーションファイルを生成します。
      exec:
        command: dart run slang build
        orderDependents: true
      packageFilters:
        dependsOn: slang
    gen:build:diff:main:
      description: main ブランチと差分のあるパッケージのみ build_runner を使用してコードを生成します。
      exec:
        command: dart run build_runner build
        orderDependents: true
      packageFilters:
        dependsOn: build_runner
        diff: origin/main...HEAD
    gen:i18n:diff:main:
      description: main ブランチと差分のあるパッケージのみ 多言語対応のためのローカライゼーションファイルを生成します。
      exec:
        command: dart run slang build
        orderDependents: true
      packageFilters:
        dependsOn: slang
        diff: origin/main...HEAD
    # ローカル確認用
    # - 未コミットの差分パッケージのみ[build_runner][i18n]を処理するスクリプト
    gen:diff:head:
      description: 未コミットの差分パッケージのみ build_runner と i18n の生成コマンドを実行します。
      steps:
        - gen:build:diff:head
        - gen:i18n:diff:head
    gen:build:diff:head:
      description: 未コミットの差分パッケージのみ build_runner を使用してコードを生成します。
      exec:
        command: dart run build_runner build
        orderDependents: true
      packageFilters:
        dependsOn: build_runner
        diff: ""
    gen:i18n:diff:head:
      description: 未コミットの差分パッケージのみ ローカライゼーションファイル を生成します。
      exec:
        command: dart run slang build
        orderDependents: true
      packageFilters:
        dependsOn: slang
        diff: ""
    gen:labeler:
      description: "`.github/labeler.yml` のパッケージ部分を生成します。"
      run: dart run ./tools/gen_labeler.dart
    gen:labels:
      description: "`.github/labels.yml` のパッケージ部分を生成します。"
      run: dart run ./tools/gen_labels.dart

    upgrade:
      description: dart pub のバージョンアップを実施します。
      exec:
        command: dart pub upgrade
        concurrency: 1
        orderDependents: true
    upgrade:major:
      description: dart pub のメジャーバージョンアップを実施します。
      exec:
        command: dart pub upgrade --major-versions
        concurrency: 1
        orderDependents: true
    update:yumemi_lints:
      description: yumemi_lints の更新を実行します。
      exec: dart run yumemi_lints update
      packageFilters:
        dependsOn: yumemi_lints

    # dependsOn で or 条件で指定することができないため
    # スクリプトを Flutter と Dart に分けている
    test:
      description: すべてのパッケージのテストを実行します。
      steps:
        - test:flutter
        - test:dart
    test:flutter:
      description: Flutter パッケージのテストを実行します。
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        dependsOn: flutter_test
        dirExists: test
        ignore:
          - catalog
    test:dart:
      description: Dart パッケージのテストを実行します。
      exec:
        command: dart test
        concurrency: 1
      packageFilters:
        dependsOn: test
        dirExists: test

    # dependsOn で or 条件で指定することができないため
    # スクリプトを Flutter と Dart に分けている
    report:test:
      description: すべてのパッケージのテストレポートを生成します。
      steps:
        - report:test:flutter
        - report:test:dart
    report:test:flutter:
      description: Flutter パッケージのテストレポートを生成します。
      exec:
        command: flutter test --no-pub --machine > test_report.log
        concurrency: 1
      packageFilters:
        dependsOn: flutter_test
        dirExists: test
        ignore:
          - catalog
    report:test:dart:
      description: Dart パッケージのテストレポートを生成します。
      exec:
        command: dart test --file-reporter="json:test_report.log"
        concurrency: 1
      packageFilters:
        dependsOn: test
        dirExists: test

    golden_test:ci:
      description: golden_test を実行します。
      exec:
        command: flutter test --tags golden
        failFast: true
      packageFilters:
        scope:
          - catalog
    golden_test:
      description: golden_test を実行し, ファイルを生成します。
      exec:
        command: flutter test --update-goldens
        failFast: true
      packageFilters:
        scope:
          - catalog

    pod:repo_update:ios:
      description: ios の pod のリポジトリを更新します。
      run: pod repo update
      packageFilters:
        fileExists: ios/Podfile

    pod:repo_update:macos:
      description: macos の pod のリポジトリを更新します。
      run: pod repo update
      packageFilters:
        fileExists: macos/Podfile
