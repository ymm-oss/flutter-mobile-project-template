# Default labels
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "package_update"
  color: "0e8a16"
  description: "Packages that need to be updated"

- name: "vulnerability"
  color: "b60205"
  description: "Packages with known vulnerabilities"

# Labels used by issue templates
- name: "feature"
  color: "1d76db"
  description: "New feature request"

- name: "improve"
  color: "5319e7"
  description: "Improvement to existing features"

- name: "triage"
  color: "fbca04"
  description: "Needs to be triaged"

# Labels used by initialization issues
- name: "initialization"
  color: "c5def5"
  description: "Initial setup task for a project created from the template"

- name: "optional"
  color: "bfdadc"
  description: "Optional initial setup task"

- name: "required"
  color: "d93f0b"
  description: "Required initial setup task"

- name: "ai-support"
  color: "006b75"
  description: "Initial setup task for AI development support"

# Labels used by Dependabot
- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"

- name: "github_actions"
  color: "000000"
  description: "Pull requests that update GitHub Actions code"
