name: "Setup Application Runtime"
description: "Setup application runtime for Flutter"

inputs:
  enforce-lockfile:
    description: "pubspec.lock と異なる依存が解決された場合に失敗させるかどうか"
    default: "true"

runs:
  using: "composite"
  steps:

    # https://github.com/jdx/mise-action
    - name: Setup flutter
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        install_args: "flutter"

    # dart run は pubspec.lock が古いと --enforce-lockfile なしで pub get を実行するため、
    # 先に flutter pub get --enforce-lockfile でロックファイルとの一致を確認する
    - name: Setup melos
      run: |
        if [[ "$ENFORCE_LOCKFILE" == "true" ]]; then
          flutter pub get --enforce-lockfile
          dart run melos bootstrap --enforce-lockfile
        else
          flutter pub get
          dart run melos bootstrap
        fi
      shell: bash
      env:
        ENFORCE_LOCKFILE: ${{ inputs.enforce-lockfile }}
