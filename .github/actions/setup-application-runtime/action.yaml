name: "Setup Application Runtime"
description: "Setup application runtime for Flutter"

inputs:
  enforce-lockfile:
    description: "Whether to fail if resolved dependencies differ from pubspec.lock"
    default: "true"
  save-cache:
    description: "mise と pub のキャッシュを保存する。キャッシュを作るワークフローだけ true にする"
    default: "false"

runs:
  using: "composite"
  steps:

    # https://github.com/jdx/mise-action
    # インストール直後に保存すると、初回の flutter で作る flutter tool がキャッシュに入らないため、ジョブの終わりに保存する
    # PR と merge queue のキャッシュはほかの実行から読めないため、既定ブランチでだけ保存する
    # schedule は既定ブランチでしか動かないため、ref を比べない
    - name: Setup flutter
      uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        install_args: "flutter"
        cache_save: ${{ inputs.save-cache == 'true' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) }}
        cache_save_post: true

    # https://github.com/actions/cache/tree/main/restore
    - name: Restore pub cache
      id: restore-pub-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: ${{ runner.os }}-pub-cache-

    # dart run は pubspec.lock が古いと --enforce-lockfile なしで pub get を実行するため、
    # 先に flutter pub get --enforce-lockfile でロックファイルとの一致を確認する
    - name: Get dependencies
      run: |
        if [[ "$ENFORCE_LOCKFILE" == "true" ]]; then
          flutter pub get --enforce-lockfile
        else
          flutter pub get
        fi
      shell: bash
      env:
        ENFORCE_LOCKFILE: ${{ inputs.enforce-lockfile }}

    - name: Setup melos
      run: |
        if [[ "$ENFORCE_LOCKFILE" == "true" ]]; then
          dart run melos bootstrap --enforce-lockfile
        else
          dart run melos bootstrap
        fi
      shell: bash
      env:
        ENFORCE_LOCKFILE: ${{ inputs.enforce-lockfile }}

    # https://github.com/actions/cache/tree/main/save
    # mise と同じく、既定ブランチでだけ保存する
    - name: Save pub cache
      if: inputs.save-cache == 'true' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) && steps.restore-pub-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: ${{ steps.restore-pub-cache.outputs.cache-primary-key }}
