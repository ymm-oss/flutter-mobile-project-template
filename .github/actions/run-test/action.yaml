name: "Run Test"
description: "Run tests of all packages and report the results"

inputs:
  report:
    description: "Whether to report the test results to the checks (requires checks: write)"
    default: "true"

runs:
  using: "composite"
  steps:

    # composite action ではステップが失敗すると後続のステップが飛ばされるため、
    # ここでは失敗させずに終了コードを記録し、レポートの後でジョブを失敗させる
    - name: Run test
      id: test
      run: |
        exit_code=0
        dart run melos run report:test --no-select || exit_code=$?
        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"
      shell: bash

    # https://github.com/andstor/file-existence-action
    - name: Check file existence
      id: check_files
      uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
      with:
        # https://github.com/isaacs/node-glob の形式
        files: "**/test_report.log"

    # https://github.com/dorny/test-reporter
    - name: Report test
      if: ${{ inputs.report == 'true' && steps.check_files.outputs.files_exists == 'true' }}
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: "flutter test"
        # https://github.com/mrmlnc/fast-glob の形式
        path: "(apps|packages)/**/test_report.log"
        reporter: "flutter-json"
        fail-on-error: "true"

    # コンパイルエラーなどで test_report.log が作られない場合も、終了コードで失敗を検知する
    - name: Fail on test failure
      if: ${{ steps.test.outputs.exit-code != '0' }}
      run: |
        echo "::error::Tests failed with exit code $EXIT_CODE"
        exit 1
      shell: bash
      env:
        EXIT_CODE: ${{ steps.test.outputs.exit-code }}
