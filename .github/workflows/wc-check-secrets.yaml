name: Check Secrets

on:
  workflow_call:
    inputs:
      base-sha:
        description: 検査する範囲の始点（このコミットは含まない）
        required: true
        type: string
      head-sha:
        description: 検査する範囲の終点
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.head-sha }}
          fetch-depth: 0

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: "gitleaks"

      # https://github.com/gitleaks/gitleaks
      # 範囲を解決できず git log が失敗しても gitleaks は終了コード 0 で成功するため、BASE と HEAD のコミットがあることを先に確かめる。
      # git log -p はマージコミットの差分を出さないため、自動マージの結果との差分（競合の解消など）を検査する。
      # 作業ツリーは検査するコミット側の内容なので、そこにある除外の設定を使わない。設定と除外は base のコミットから取り出す。
      # - --config: 指定しないと作業ツリーの .gitleaks.toml を使う。base の .gitleaks.toml を渡し、無ければ既定ルールだけの設定を渡す。
      # - --gitleaks-ignore-path: 既定はカレントディレクトリで、作業ツリーの .gitleaksignore を読む。base の .gitleaksignore を渡し、無ければ空のファイルを渡す。
      # - --ignore-gitleaks-allow: 行コメントの gitleaks:allow を無視する。
      # - 検査対象を作業ツリーではなく git のディレクトリにする: gitleaks は検査対象の直下の .gitleaksignore も読む。git log も作業ツリーの .gitattributes（-diff など）を使わなくなる。
      #   gitleaks は検査対象で git log を実行するため、コミットがあるかも同じ場所で確かめる。
      # - 空のディレクトリで実行する: 設定の [extend] path の相対パスは、カレントディレクトリから読まれる。作業ツリーで実行すると、PR が書き換えたファイルを読む。
      #   空のディレクトリでは参照先が無いため、base の設定が相対パスで別のファイルを読むと失敗する。
      - name: Run gitleaks
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          git_dir=$(git rev-parse --absolute-git-dir)
          git -C "$git_dir" cat-file -e "$BASE_SHA^{commit}"
          git -C "$git_dir" cat-file -e "$HEAD_SHA^{commit}"

          config_dir="$RUNNER_TEMP/gitleaks-config"
          empty_dir="$RUNNER_TEMP/gitleaks-cwd"
          mkdir "$config_dir" "$empty_dir"
          config="$config_dir/gitleaks.toml"
          ignore="$config_dir/gitleaksignore"
          if git -C "$git_dir" cat-file -e "$BASE_SHA:.gitleaks.toml" 2> /dev/null; then
            git -C "$git_dir" show "$BASE_SHA:.gitleaks.toml" > "$config"
          else
            printf '[extend]\nuseDefault = true\n' > "$config"
          fi
          if git -C "$git_dir" cat-file -e "$BASE_SHA:.gitleaksignore" 2> /dev/null; then
            git -C "$git_dir" show "$BASE_SHA:.gitleaksignore" > "$ignore"
          else
            : > "$ignore"
          fi

          cd "$empty_dir"
          gitleaks git --no-banner --redact --verbose \
            --config "$config" \
            --gitleaks-ignore-path "$ignore" \
            --ignore-gitleaks-allow \
            --log-opts="--diff-merges=remerge $BASE_SHA..$HEAD_SHA" \
            "$git_dir"
