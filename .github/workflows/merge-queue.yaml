name: Merge Queue

on:
  merge_group:

concurrency:
  group: merge-queue-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    uses: $/.github/workflows/wc-changes.yml
    permissions:
      pull-requests: read
      contents: read

  check-actions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mise dependencies
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: "jactionlint shellcheck"

      - name: Run jactionlint
        run: jactionlint --format github

  check-actions-security:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: "zizmor"

      # https://github.com/reviewdog/action-setup
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      # https://docs.zizmor.sh/
      # SARIF で出力すると zizmor は指摘があっても失敗しないため、指摘の有無は reviewdog で判定する。
      - name: Run zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor --format sarif .github |
            reviewdog -f=sarif -name=zizmor -reporter=local -filter-mode=nofilter -fail-level=any

  analyze:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Application Runtime
        uses: $/.github/actions/setup-application-runtime

      # https://github.com/reviewdog/action-setup
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      - name: Report analyze
        run: reviewdog -runners=dart-analyze -reporter=local -filter-mode=nofilter -fail-level=info

  check:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Application Runtime
        uses: $/.github/actions/setup-application-runtime

      - name: Check format
        run: dart run melos run format:check

      - name: Check for circular dependencies
        run: dart run melos list --cycles

      - name: Check debug features are excluded from release build
        run: dart run melos run check:debug_tree_shaking

  test:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Application Runtime
        uses: $/.github/actions/setup-application-runtime

      - name: Run test
        uses: $/.github/actions/run-test

  diff-gen:
    uses: $/.github/workflows/wc-check-diff.yaml
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.gen == 'true' }}

  check-openapi:
    uses: $/.github/workflows/wc-check-openapi.yaml
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.openapi == 'true' }}

  check-ai-skills:
    uses: $/.github/workflows/wc-check-ai-skills.yaml
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.ai_skills == 'true' }}

  check-vulnerabilities:
    uses: $/.github/workflows/wc-check-vulnerabilities.yaml
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.vulnerabilities == 'true' }}

  status-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - check-actions
      - check-actions-security
      - analyze
      - check
      - test
      - diff-gen
      - check-openapi
      - check-ai-skills
      - check-vulnerabilities
    permissions: {}
    if: always()
    steps:
      - name: Verify all checks passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
