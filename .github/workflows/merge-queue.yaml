name: Merge Queue

on:
  merge_group:

concurrency:
  group: merge-queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/wc-changes.yml
    permissions:
      pull-requests: read
      contents: read

  skip-comment:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.any == 'false' }}
    permissions:
      pull-requests: write
    timeout-minutes: 5

    steps:
      # https://github.com/peter-evans/create-or-update-comment
      - name: Comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            チェック対象ファイルの変更がなかったため、checkジョブをスキップしました
  check-actions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # https://github.com/marketplace/actions/actionlint-with-reviewdog
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          actionlint_flags: -ignore 'SC2153'
          fail_on_error: true
          filter_mode: nofilter
          level: error
          reporter: github-pr-review

  cache-dependencies:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.dependencies == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

  check:
    needs:
      - changes
      - cache-dependencies
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

      # https://github.com/reviewdog/action-setup
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      - name: Report analyze
        run: reviewdog -runners=dart-analyze -reporter=local -filter-mode=nofilter -fail-level=info

      - name: Check format
        run: melos run format:check

      - name: Check for circular dependencies
        run: melos list --cycles

      - name: Run test
        run: melos run report:test --no-select
        continue-on-error: true

      # https://github.com/andstor/file-existence-action
      - name: Check file existence
        id: check_files
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          # https://github.com/isaacs/node-glob の形式
          files: "**/test_report.log"

      # https://github.com/dorny/test-reporter
      - name: Report test
        if: steps.check_files.outputs.files_exists == 'true'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "flutter test"
          # https://github.com/mrmlnc/fast-glob の形式
          path: "(apps|packages)/**/test_report.log"
          reporter: "flutter-json"
          fail-on-error: "true"

  # custom_lintが時間かかるのでcheckと並列させる
  custom-lint:
    needs:
      - changes
      - cache-dependencies
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

      - name: Report custom_lint result
        run: |
          echo "::add-matcher::.github/problem_matchers/custom_lint.json"
          melos run ci:report:custom_lint --no-select || result=$?
          echo "::remove-matcher owner=custom_lint::"
          if [ -n "$result" ]; then
            exit 1
          fi
  diff-gen:
    uses: ./.github/workflows/wc-check-diff.yaml
    needs:
      - changes
      - cache-dependencies
    if: ${{ needs.changes.outputs.gen == 'true' }}

  status-check:
    runs-on: ubuntu-24.04
    needs:
      - check-actions
      - check
      - custom-lint
      - diff-gen
    permissions: {}
    if: failure()
    steps:
      - run: exit 1
