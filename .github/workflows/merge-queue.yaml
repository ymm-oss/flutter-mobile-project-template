name: Merge Queue

on:
  merge_group:

concurrency:
  group: merge-queue-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    uses: ./.github/workflows/wc-changes.yml
    permissions:
      pull-requests: read
      contents: read

  check-actions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/marketplace/actions/actionlint-with-reviewdog
      - uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          actionlint_flags: -ignore 'SC2153'
          fail_on_error: true
          filter_mode: nofilter
          level: error
          reporter: github-pr-review

  check-actions-security:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: "zizmor"

      # https://github.com/reviewdog/action-setup
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      # https://docs.zizmor.sh/
      # SARIF で出力すると zizmor は指摘があっても失敗しないため、指摘の有無は reviewdog で判定する。
      - name: Run zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor --format sarif .github |
            reviewdog -f=sarif -name=zizmor -reporter=local -filter-mode=nofilter -fail-level=any

  cache-dependencies:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.dependencies == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

  check:
    needs:
      - changes
      - cache-dependencies
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

      # https://github.com/reviewdog/action-setup
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      - name: Report analyze
        run: reviewdog -runners=dart-analyze -reporter=local -filter-mode=nofilter -fail-level=info

      - name: Check format
        run: dart run melos run format:check

      - name: Check for circular dependencies
        run: dart run melos list --cycles

      - name: Check debug features are excluded from release build
        run: dart run melos run check:debug_tree_shaking

      - name: Run test
        uses: ./.github/actions/run-test

  diff-gen:
    uses: ./.github/workflows/wc-check-diff.yaml
    permissions:
      contents: read
    needs:
      - changes
      - cache-dependencies
    if: ${{ needs.changes.outputs.gen == 'true' }}

  check-ai-skills:
    uses: ./.github/workflows/wc-check-ai-skills.yaml
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.ai_skills == 'true' }}

  status-check:
    runs-on: ubuntu-24.04
    needs:
      - changes
      - check-actions
      - check-actions-security
      - cache-dependencies
      - check
      - diff-gen
      - check-ai-skills
    permissions: {}
    if: always()
    steps:
      - name: Verify all checks passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
