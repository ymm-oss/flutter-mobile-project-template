name: Check AI Skills

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-ai-skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check AI skill symlinks
        run: scripts/sync-ai-skills.sh --check
