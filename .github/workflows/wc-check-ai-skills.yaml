name: Check AI Skills

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-ai-skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check AI skill symlinks
        run: scripts/sync-ai-skills.sh --check
