name: check-pr

on:
  pull_request:

concurrency:
  group: check-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/wc-changes.yml
    permissions:
      pull-requests: read
      contents: read

  skip-comment:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.any == 'false' }}
    permissions:
      pull-requests: write
    timeout-minutes: 5

    steps:
      # https://github.com/peter-evans/create-or-update-comment
      - name: Comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            チェック対象ファイルの変更がなかったため、checkジョブをスキップしました

  check-actions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/marketplace/actions/actionlint-with-reviewdog
      - uses: reviewdog/action-actionlint@5d802a8ebdcb24d712925118c3a4596f571d8fcd # v1.81.0
        with:
          actionlint_flags: -ignore 'SC2153'
          fail_on_error: true
          filter_mode: nofilter
          level: error
          reporter: github-pr-review

  cache-dependencies:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.dependencies == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

  check:
    needs:
      - changes
      - cache-dependencies
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

      # https://github.com/reviewdog/action-setup
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      - name: Report analyze
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: reviewdog -runners=dart-analyze -reporter=github-pr-review -filter-mode=nofilter -fail-level=info

      - name: Check format
        run: dart run melos run format:check

      - name: Check for circular dependencies
        run: dart run melos list --cycles

      - name: Check debug features are excluded from release build
        run: dart run melos run check:debug_tree_shaking

      - name: Run test
        id: test
        run: dart run melos run report:test --no-select
        continue-on-error: true

      # https://github.com/andstor/file-existence-action
      - name: Check file existence
        id: check_files
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          # https://github.com/isaacs/node-glob の形式
          files: "**/test_report.log"

      # https://github.com/dorny/test-reporter
      - name: Report test
        if: ${{ steps.check_files.outputs.files_exists == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "flutter test"
          # https://github.com/mrmlnc/fast-glob の形式
          path: "(apps|packages)/**/test_report.log"
          reporter: "flutter-json"
          fail-on-error: "true"

      # レポートが作られない失敗（コンパイルエラーなど）や fork からの PR も検知するため、テストの終了コードでも判定する
      - name: Fail on test failure
        if: ${{ steps.test.outcome == 'failure' }}
        run: |
          echo "::error::flutter test failed. See the 'Run test' step for details."
          exit 1

  diff-gen:
    uses: ./.github/workflows/wc-check-diff.yaml
    with:
      diff-packages: true
    needs:
      - changes
      - cache-dependencies
    if: ${{ needs.changes.outputs.gen == 'true' }}

  check-dependencies:
    uses: ./.github/workflows/wc-check-dependencies.yml
    permissions:
      pull-requests: write
      contents: read
    needs:
      - changes
      - cache-dependencies
    if: ${{ needs.changes.outputs.gen == 'true' }}

  check-style-dprint:
    uses: ./.github/workflows/wc-check-style-dprint.yaml
    needs: changes
    if: ${{ needs.changes.outputs.dprint == 'true' }}

  check-code-spell:
    uses: ./.github/workflows/wc-check-code-spell.yaml
    needs: changes
    if: ${{ needs.changes.outputs.spell == 'true' }}

  check-ai-skills:
    uses: ./.github/workflows/wc-check-ai-skills.yaml
    needs: changes
    if: ${{ needs.changes.outputs.ai_skills == 'true' }}

  status-check:
    runs-on: ubuntu-24.04
    needs:
      - changes
      - skip-comment
      - check-actions
      - cache-dependencies
      - check
      - diff-gen
      - check-dependencies
      - check-style-dprint
      - check-code-spell
      - check-ai-skills
    permissions: {}
    if: always()
    steps:
      - name: Verify all checks passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
