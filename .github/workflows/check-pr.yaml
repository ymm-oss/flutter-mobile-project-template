name: check-pr

on:
  pull_request:

concurrency:
  group: check-pr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    uses: ./.github/workflows/wc-changes.yml
    permissions:
      pull-requests: read
      contents: read

  skip-comment:
    runs-on: ubuntu-slim
    needs: changes
    if: ${{ needs.changes.outputs.any == 'false' }}
    permissions:
      pull-requests: write
    timeout-minutes: 5

    steps:
      # https://github.com/peter-evans/create-or-update-comment
      - name: Comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            チェック対象ファイルの変更がなかったため、checkジョブをスキップしました

  check-actions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/marketplace/actions/actionlint-with-reviewdog
      - uses: reviewdog/action-actionlint@7abf25e1607ec65838b73d0484ff31f8e9499d80 # v1.81.2
        with:
          actionlint_flags: -ignore 'SC2153'
          fail_on_error: true
          filter_mode: nofilter
          level: error
          reporter: github-pr-review

  check-actions-security:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: "zizmor"

      # https://github.com/reviewdog/action-setup
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      # https://docs.zizmor.sh/
      # SARIF で出力すると zizmor は指摘があっても失敗しないため、指摘の有無は reviewdog で判定する。
      - name: Run zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          zizmor --format sarif .github |
            reviewdog -f=sarif -name=zizmor -reporter=github-pr-review -filter-mode=nofilter -fail-level=any

  check-secrets:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: "gitleaks"

      # https://github.com/gitleaks/gitleaks
      # 範囲を解決できず git log が失敗しても gitleaks は終了コード 0 で成功するため、BASE と HEAD のコミットがあることを先に確かめる。
      # git log -p はマージコミットの差分を出さないため、自動マージの結果との差分（競合の解消など）を検査する。
      - name: Run gitleaks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          gitleaks git --no-banner --redact --verbose --log-opts="--diff-merges=remerge $BASE_SHA..$HEAD_SHA" .

  cache-dependencies:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.dependencies == 'true' }}
    timeout-minutes: 10

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

  check:
    needs:
      - changes
      - cache-dependencies
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

      # https://github.com/reviewdog/action-setup
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      - name: Report analyze
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: reviewdog -runners=dart-analyze -reporter=github-pr-review -filter-mode=nofilter -fail-level=info

      - name: Check format
        run: dart run melos run format:check

      - name: Check for circular dependencies
        run: dart run melos list --cycles

      - name: Check debug features are excluded from release build
        run: dart run melos run check:debug_tree_shaking

      - name: Run test
        uses: ./.github/actions/run-test
        with:
          # fork からの PR ではレポートを飛ばす
          report: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  diff-gen:
    uses: ./.github/workflows/wc-check-diff.yaml
    permissions:
      contents: read
    with:
      diff-packages: true
    needs:
      - changes
      - cache-dependencies
    if: ${{ needs.changes.outputs.gen == 'true' }}

  check-dependencies:
    uses: ./.github/workflows/wc-check-dependencies.yml
    permissions:
      pull-requests: write
      contents: read
    needs:
      - changes
      - cache-dependencies
    if: ${{ needs.changes.outputs.gen == 'true' }}

  check-style-dprint:
    uses: ./.github/workflows/wc-check-style-dprint.yaml
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.dprint == 'true' }}

  check-code-spell:
    uses: ./.github/workflows/wc-check-code-spell.yaml
    permissions:
      contents: read
      pull-requests: write
    needs: changes
    if: ${{ needs.changes.outputs.spell == 'true' }}

  check-ai-skills:
    uses: ./.github/workflows/wc-check-ai-skills.yaml
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.ai_skills == 'true' }}

  check-vulnerabilities:
    uses: ./.github/workflows/wc-check-vulnerabilities.yaml
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.vulnerabilities == 'true' }}

  status-check:
    runs-on: ubuntu-24.04
    needs:
      - changes
      - skip-comment
      - check-actions
      - check-actions-security
      - check-secrets
      - cache-dependencies
      - check
      - diff-gen
      - check-dependencies
      - check-style-dprint
      - check-code-spell
      - check-ai-skills
      - check-vulnerabilities
    permissions: {}
    if: always()
    steps:
      - name: Verify all checks passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
