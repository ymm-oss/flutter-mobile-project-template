name: "Pull Request Labeler"

on:
  # fork からの PR にもラベルを付けるため、書き込み権限のあるトークンが使える pull_request_target で動かす。
  # PR のコードは checkout も実行もせず、ラベルの設定はデフォルトブランチのものを読む。
  pull_request_target: # zizmor: ignore[dangerous-triggers]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # https://github.com/srvaroa/labeler
      - name: Label manager for PRs and Issues based on configurable conditions
        uses: srvaroa/labeler@bf262763a8a8e191f5847873aecc0f29df84f957 # v1.14.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
