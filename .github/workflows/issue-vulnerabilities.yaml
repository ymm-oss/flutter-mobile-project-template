name: Issue-Vulnerabilities

on:
  schedule:
    - cron: "0 0 * * 1" # 日本標準時間 毎週月曜日の朝9:00
  workflow_dispatch:

permissions: {}

env:
  ISSUE_LABEL: vulnerability

jobs:
  vulnerabilities:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: "osv-scanner"

      # https://google.github.io/osv-scanner/output/#return-codes
      # 終了コード 1 は脆弱性が見つかったことを表すため、それ以外の失敗だけで落とす。
      - name: Run OSV-Scanner
        id: scan
        run: |
          path="$RUNNER_TEMP/osv-scanner.md"
          status=0
          osv-scanner scan source --verbosity warn --format markdown -L pubspec.lock -L bun.lock > "$path" || status=$?
          cat "$path"

          if [ "$status" -eq 1 ]; then
            echo "path=$path" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      # mise.toml のツールは OSV-Scanner で読めないため、mise audit で調べる。
      # 脆弱性が見つかっても設定を読めなくても終了コード 1 になるため、JSON を読めるかで見分ける。
      - name: Run mise audit
        id: audit
        run: |
          json="$RUNNER_TEMP/mise-audit.json"
          mise audit --json > "$json" || true
          if ! jq -e '.vulnerabilities | type == "array"' "$json" > /dev/null; then
            echo "::error::mise audit failed"
            exit 1
          fi

          rows=$(jq -r '.vulnerabilities | sort_by(.tool, .id)[]
            | "| \(.tool) | \(.version) | [\(.id)](https://osv.dev/vulnerability/\(.id)) | \(.fixed | join(", ")) |"' "$json")
          if [ -z "$rows" ]; then
            exit 0
          fi

          path="$RUNNER_TEMP/mise-audit.md"
          {
            echo "## mise audit"
            echo
            echo "| Tool | Version | ID | Fixed |"
            echo "| --- | --- | --- | --- |"
            echo "$rows"
          } | tee "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # 見つかった結果だけを、OSV-Scanner、mise audit の順につなげて本文にする
      - name: Write the issue body
        id: body
        env:
          OSV_PATH: ${{ steps.scan.outputs.path }}
          MISE_PATH: ${{ steps.audit.outputs.path }}
        run: |
          if [ -z "$OSV_PATH" ] && [ -z "$MISE_PATH" ]; then
            exit 0
          fi

          path="$RUNNER_TEMP/vulnerabilities.md"
          : > "$path"
          for part in "$OSV_PATH" "$MISE_PATH"; do
            if [ -z "$part" ]; then
              continue
            fi
            if [ -s "$path" ]; then
              echo >> "$path"
            fi
            cat "$part" >> "$path"
          done
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BODY_PATH: ${{ steps.body.outputs.path }}
        run: |
          issue_number=$(gh issue list --label "$ISSUE_LABEL" --json number --jq '.[].number')

          if [ "$(echo "$issue_number" | grep -c .)" -gt 1 ]; then
            echo "Multiple issues exist. Please check the issue."
            exit 1
          fi

          # 脆弱性が解消したら Issue を閉じる
          if [ -z "$BODY_PATH" ]; then
            if [ -n "$issue_number" ]; then
              gh issue close "$issue_number" --comment "No vulnerabilities found."
            fi
            exit 0
          fi

          if [ -z "$issue_number" ]; then
            gh issue create --title "Fix vulnerabilities" --label "$ISSUE_LABEL" --body-file "$BODY_PATH"
            exit 0
          fi

          # 前回の結果は Actions の最新のコメント、なければ Issue の本文にある
          latest=$(gh issue view "$issue_number" --json body,comments \
            --jq '([.comments[] | select(.author.login == "github-actions")] | last.body) // .body')
          if [ "$latest" == "$(cat "$BODY_PATH")" ]; then
            echo "The latest result is the same as the current result"
            exit 0
          fi

          gh issue comment "$issue_number" --body-file "$BODY_PATH"
