name: Check Spell

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-spell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: "bun"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # https://github.com/reviewdog/action-setup
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      - name: Run spell check
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: reviewdog -runners=cspell -reporter=github-pr-review -filter-mode=nofilter -fail-level=error
