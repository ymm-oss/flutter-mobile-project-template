name: Check Spell

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-spell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: "bun"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # https://github.com/reviewdog/action-setup
      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      # fork からの PR では GITHUB_TOKEN が read-only でレビューコメントを投稿できない。
      # その場合は local reporter にし、cspell の終了コードで合否を決める。
      - name: Run spell check
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            reporter=github-pr-review
          else
            reporter=local
          fi
          bun --bun run cspell lint 2>&1 \
            | reviewdog -efm='%f:%l:%c - %m' -name=cspell -reporter="$reporter" -filter-mode=diff_context -level=error
