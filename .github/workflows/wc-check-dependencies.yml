name: Check dependencies

on:
  workflow_call:

jobs:
  check-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

      - name: Check package dependencies
        id: dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseRefName="${{ github.base_ref }}"

          echo "The base branch is $baseRefName"

          # raw は 100MB 未満のファイルを返せる。lock ファイルはこの範囲に収まる。
          base_lock="${RUNNER_TEMP}/base-pubspec.lock"
          gh api \
            --method GET \
            -H "Accept: application/vnd.github.raw+json" \
            "/repos/${GITHUB_REPOSITORY}/contents/pubspec.lock" \
            -f ref="$baseRefName" \
            > "$base_lock"

          diff=$(dart run ./tools/diff_yaml.dart "$base_lock" pubspec.yaml pubspec.lock)

          if [ -z "$diff" ]; then
            echo "No change in pubspec.lock"
          else
            echo "There is a change in pubspec.lock."

            path="$GITHUB_WORKSPACE/$(date +%Y%m%d%H%M%S)"
            echo "$diff" > "$path"
            echo "path=$path" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment
        if: ${{ steps.dependencies.outputs.path != '' }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file "${{ steps.dependencies.outputs.path }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
