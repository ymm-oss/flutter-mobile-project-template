name: Pull Request Check Rebase or Force Push

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: pr-rebase-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-rebase:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Detect rebase between pushes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the SHA of the commit before and after the push
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.event.after }}"

          echo "Before: $BEFORE_SHA"
          echo "After: $AFTER_SHA"

          # 新規ブランチの初回 push などでは before がゼロ SHA になる
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$ZERO_SHA" ] || [ -z "$BEFORE_SHA" ]; then
            echo "rebase=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 旧先端が新先端の祖先なら merge base は旧先端になる。
          # コメント用の一覧は Compare API が返す最新の最大 250 件。真偽判定には使わない。
          compare=$(gh api "/repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${AFTER_SHA}")
          merge_base=$(jq -r '.merge_base_commit.sha' <<< "$compare")

          if [ "$merge_base" = "$BEFORE_SHA" ]; then
            echo "rebase=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "rebase=true" >> "$GITHUB_OUTPUT"

          {
            echo "rebased_commits<<EOF"
            # main の "Merge pull request #N" を載せると #N の PR に参照が記録されるため、
            # 以前の実装と同じくマージコミットは除く
            jq -r '
              (.commits[] | select(.parents | length <= 1)
                | "- \(.sha) (\(.commit.message | split("\n")[0]))"),
              (if .total_commits > (.commits | length)
                then "\nコミットが多いため、全 \(.total_commits) 件のうち最新の \(.commits | length) 件までを対象にしています。"
                else empty end)
            ' <<< "$compare"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post comment if rebased
        if: steps.check.outputs.rebase == 'true'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            :warning: **Rebase or force-push detected in this push**
            旧先端（push 前の HEAD）が現在の履歴に含まれないため、rebase または強制 push が行われた可能性があります。
            関連するコミットは以下の通りです。

            ${{ steps.check.outputs.rebased_commits }}
