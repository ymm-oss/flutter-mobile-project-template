name: Check generated code is latest

on:
  workflow_call:
    inputs:
      diff-packages:
        description: "差分パッケージのみを処理するかどうか"
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # 全履歴を取得

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

      # https://github.com/actions/cache/tree/main/restore
      # コードの変更でキャッシュを更新するため、キーにコミットを含める
      - name: Restore build runner cache
        id: restore-build-runner-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/.dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock') }}-
            ${{ runner.os }}-build-runner-

      - name: Regenerate code
        run: |
          if [ "${{ inputs.diff-packages }}" = "true" ]; then
            dart run melos run gen:diff:main
          else
            dart run melos run gen
          fi

      # https://github.com/actions/cache/tree/main/save
      # キーがコミットごとに変わり、PR と merge queue で保存すると容量を使うため、main でだけ保存する
      - name: Save build runner cache
        if: github.ref == 'refs/heads/main' && steps.restore-build-runner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/.dart_tool/build
          key: ${{ steps.restore-build-runner-cache.outputs.cache-primary-key }}

      - name: Check difference
        run: |
          git add -N .
          git diff --name-only --exit-code
