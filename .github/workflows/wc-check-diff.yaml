name: Check generated code is latest

on:
  workflow_call:
    inputs:
      diff-packages:
        description: "差分パッケージのみを処理するかどうか"
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 既定ブランチとの差分を取るため、全履歴と refs/remotes/origin/<既定ブランチ> を取得する。浅くすると origin/HEAD...HEAD を解決できない
          fetch-depth: 0

      # actions/checkout は origin/HEAD を作らないため、取得済みの既定ブランチを指すように設定する
      - name: Set origin/HEAD
        if: ${{ inputs.diff-packages }}
        run: git symbolic-ref refs/remotes/origin/HEAD "refs/remotes/origin/${DEFAULT_BRANCH}"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Setup Application Runtime
        uses: ./.github/actions/setup-application-runtime

      # https://github.com/actions/cache
      - name: Cache build runner
        id: cache-build-runner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: build-runner
        with:
          path: |
            **/.dart_tool/build
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.cache-name }}-

      - name: Regenerate code
        run: |
          if [ "${{ inputs.diff-packages }}" = "true" ]; then
            dart run melos run gen:diff:default
          else
            dart run melos run gen
          fi

      # update:yumemi_lints は、yumemi_lints を依存に直接書いたパッケージ（今は samples/webview）の analysis_options.yaml を、
      # そのパッケージの pubspec.yaml の environment から書き直す。environment は melos bootstrap がルートから書き込むため、bootstrap の後に実行する。
      # ルートの analysis_options.yaml は対象外で、ルートの include: が古くてもこの検査は失敗しない
      - name: Update yumemi_lints
        run: dart run melos run update:yumemi_lints --no-select

      - name: Check difference
        run: |
          git add -N .
          git diff --name-only --exit-code
