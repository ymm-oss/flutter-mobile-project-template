name: "Check for changes in paths"

on:
  workflow_call:
    outputs:
      gen:
        value: ${{ jobs.changes.outputs.gen }}
      any:
        value: ${{ jobs.changes.outputs.any }}
      actions:
        value: ${{ jobs.changes.outputs.actions }}
      dprint:
        value: ${{ jobs.changes.outputs.dprint }}
      markdown:
        value: ${{ jobs.changes.outputs.markdown }}
      src:
        value: ${{ jobs.changes.outputs.src }}
      spell:
        value: ${{ jobs.changes.outputs.spell }}
      ai_skills:
        value: ${{ jobs.changes.outputs.ai_skills }}
      dependencies:
        value: ${{ jobs.changes.outputs.dependencies }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read
    outputs:
      any: ${{ steps.filter.outputs.changes != '[]' }}
      actions: ${{ steps.filter.outputs.actions }}
      dprint: ${{ steps.filter.outputs.dprint }}
      gen: ${{ steps.filter.outputs.gen }}
      markdown: ${{ steps.filter.outputs.markdown }}
      src: ${{ steps.filter.outputs.src }}
      spell: ${{ steps.filter.outputs.spell }}
      ai_skills: ${{ steps.filter.outputs.ai_skills }}
      dependencies: ${{ steps.needs.outputs.dependencies }}
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/marketplace/actions/paths-changes-filter
      - name: Paths Changes Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            actions:
              - '.github/actions/**/action.yml'
              - '.github/actions/**/action.yaml'
              - '.github/workflows/*.yml'
              - '.github/workflows/*.yaml'
            dprint:
              - "**.json"
              - "**.jsonc"
              - "**.md"
              - "**.toml"
              - "**.yml"
              - "**.yaml"
            gen:
              - "**.dart"
              - "**.yaml"
              - "**/pubspec.lock"
            markdown:
              - "**.md"
            src:
              - "**.dart"
              - "**.yaml"
              - "**/pubspec.lock"
              - "scripts/**"
              - ".reviewdog.yml"
            spell:
              - "**.md"
              - "**.yaml"
              - "**.yml"
              - "**.dart"
              # cspell の設定や実行環境が変わったときも検証する
              - "cspell.jsonc"
              - ".cspell/**"
              - "package.json"
              - "bun.lock"
              - "mise.toml"
              - "mise.lock"
            ai_skills:
              - ".agents/**"
              - ".claude/**"
              - "scripts/sync-ai-skills.sh"
              - ".gitattributes"
              - ".github/workflows/wc-check-ai-skills.yaml"

      - name: Check for dependencies changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: needs
        with:
          script: |
            const changes = ${{ steps.filter.outputs.changes }};

            // 依存関係の解決が必要な変更箇所
            const dependencies = [
              'gen',
              'lint',
              'src',
            ];
            core.setOutput('dependencies', changes.some(value => dependencies.includes(value)));
