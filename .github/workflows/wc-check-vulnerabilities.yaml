name: Check vulnerabilities

on:
  workflow_call:

jobs:
  check-vulnerabilities:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 既存の脆弱性は週次の Issue で追うため、ベースにない脆弱性だけで落とす。
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: base
          sparse-checkout: |
            pubspec.lock
            bun.lock
            osv-scanner.toml
            mise.toml
          sparse-checkout-cone-mode: false

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: "osv-scanner"

      # https://google.github.io/osv-scanner/output/#return-codes
      - name: Run OSV-Scanner
        shell: bash
        run: |
          scan() {
            status=0
            osv-scanner scan source --format json -L "$1/pubspec.lock" -L "$1/bun.lock" > "$2" || status=$?
            if [ "$status" -gt 1 ]; then
              exit "$status"
            fi
          }
          scan base "$RUNNER_TEMP/base.json"
          scan . "$RUNNER_TEMP/head.json"

      # mise.toml のツールは OSV-Scanner で読めないため、mise audit で調べる。
      # 脆弱性が見つかっても設定を読めなくても終了コード 1 になるため、JSON を読めるかで見分ける。
      - name: Run mise audit
        shell: bash
        run: |
          audit() {
            mise audit --json -C "$1" > "$2" || true
            if ! jq -e '.vulnerabilities | type == "array"' "$2" > /dev/null; then
              echo "::error::mise audit failed in $1"
              exit 1
            fi
          }
          # ワークスペースの中では親のフォルダにあるヘッドの mise.toml も読まれるため、外に写して調べる。
          mkdir "$RUNNER_TEMP/base-mise"
          cp base/mise.toml "$RUNNER_TEMP/base-mise/"
          mise trust "$RUNNER_TEMP/base-mise/mise.toml"
          audit "$RUNNER_TEMP/base-mise" "$RUNNER_TEMP/base-mise.json"
          audit . "$RUNNER_TEMP/head-mise.json"

      - name: Report new vulnerabilities
        shell: bash
        run: |
          new=$(jq -rn \
            --slurpfile osv_base "$RUNNER_TEMP/base.json" \
            --slurpfile osv_head "$RUNNER_TEMP/head.json" \
            --slurpfile mise_base "$RUNNER_TEMP/base-mise.json" \
            --slurpfile mise_head "$RUNNER_TEMP/head-mise.json" '
            def osv: [.results[]?.packages[]? | .package as $p | .vulnerabilities[]?
              | {ecosystem: $p.ecosystem, name: $p.name, version: $p.version, id}];
            def mise: [.vulnerabilities[] | {ecosystem: "mise", name: .tool, version, id}];
            (($osv_base[0] | osv) + ($mise_base[0] | mise) | map({ecosystem, name, id})) as $known
            | ($osv_head[0] | osv) + ($mise_head[0] | mise)
            | .[]
            | select({ecosystem, name, id} as $k | any($known[]; . == $k) | not)
            | "| \(.ecosystem) | \(.name) | \(.version) | [\(.id)](https://osv.dev/vulnerability/\(.id)) |"
          ')

          if [ -z "$new" ]; then
            echo "No new vulnerabilities found." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## New vulnerabilities"
            echo
            echo "| Ecosystem | Package | Version | ID |"
            echo "| --- | --- | --- | --- |"
            echo "$new"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
