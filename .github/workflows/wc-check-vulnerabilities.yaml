name: Check vulnerabilities

on:
  workflow_call:

jobs:
  check-vulnerabilities:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 既存の脆弱性は週次の Issue で追うため、ベースにない脆弱性だけで落とす。
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: base
          sparse-checkout: |
            pubspec.lock
            bun.lock
            osv-scanner.toml
            mise.toml
            mise.lock
          sparse-checkout-cone-mode: false

      # https://github.com/jdx/mise-action
      - name: Install Mise dependencies
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # mise audit の JSON の形と標準エラーの出し方に頼るため、確かめたバージョンに固定する。
          version: "2026.11.14"
          install_args: "osv-scanner"
          # PR の mise.toml の [env]（_.path を含む）を、後続のステップに持ち込まない。
          # 持ち込むと、PR が置いた jq などのプログラムで検査の結果を書き換えられる。
          env: false
          export_path: false

      # https://google.github.io/osv-scanner/output/#return-codes
      - name: Run OSV-Scanner
        shell: bash
        run: |
          scan() {
            status=0
            osv-scanner scan source --format json -L "$1/pubspec.lock" -L "$1/bun.lock" > "$2" || status=$?
            if [ "$status" -gt 1 ]; then
              exit "$status"
            fi
          }
          scan base "$RUNNER_TEMP/base.json"
          scan . "$RUNNER_TEMP/head.json"

      # mise.toml のツールは OSV-Scanner で読めないため、mise audit で調べる。
      # 脆弱性が見つかっても設定を読めなくても終了コード 1 になるため、JSON を読めるかで見分ける。
      # バージョンを解決できないツールがあると、JSON を出したあとに標準エラーに ERROR を出すため、それも失敗にする。
      - name: Run mise audit
        shell: bash
        run: |
          # mise は mise.toml のほかに mise.local.toml や .config/mise/config.toml なども読む。
          # そこに書いたツールが検査やレビューから漏れないよう、ワークスペースに mise.toml 以外の設定があれば失敗にする。
          others=$(mise config ls --json | jq -r --arg root "$PWD" \
            '.[].path | select(startswith($root + "/") and . != $root + "/mise.toml")')
          if [ -n "$others" ]; then
            echo "::error::Move the settings in these files to mise.toml: $(echo "$others" | tr '\n' ' ')"
            exit 1
          fi

          audit() {
            mise audit --json -C "$1" > "$2" 2> "$2.log" || true
            cat "$2.log" >&2
            if ! jq -e '.vulnerabilities | type == "array"' "$2" > /dev/null || grep -q ERROR "$2.log"; then
              echo "::error::mise audit failed in $1"
              exit 1
            fi
          }
          # ワークスペースの中では親のフォルダにあるヘッドの mise.toml も読まれるため、外に写して調べる。
          # ヘッドと同じく mise.lock からバージョンを解決できるよう、mise.lock も写す。
          # CI（CI=true）では mise が設定を自動で信頼するため、mise trust は実行しない。
          mkdir "$RUNNER_TEMP/base-mise"
          cp base/mise.toml base/mise.lock "$RUNNER_TEMP/base-mise/"
          audit "$RUNNER_TEMP/base-mise" "$RUNNER_TEMP/base-mise.json"
          audit . "$RUNNER_TEMP/head-mise.json"

      - name: Report new vulnerabilities
        shell: bash
        run: |
          new=$(jq -rn \
            --slurpfile osv_base "$RUNNER_TEMP/base.json" \
            --slurpfile osv_head "$RUNNER_TEMP/head.json" \
            --slurpfile mise_base "$RUNNER_TEMP/base-mise.json" \
            --slurpfile mise_head "$RUNNER_TEMP/head-mise.json" '
            def osv: [.results[]?.packages[]? | .package as $p | .vulnerabilities[]?
              | {ecosystem: $p.ecosystem, name: $p.name, version: $p.version, id}];
            def mise: [.vulnerabilities[] | {ecosystem: "mise", name: .tool, version, id}];
            (($osv_base[0] | osv) + ($mise_base[0] | mise) | map({ecosystem, name, id})) as $known
            | ($osv_head[0] | osv) + ($mise_head[0] | mise)
            | .[]
            | select({ecosystem, name, id} as $k | any($known[]; . == $k) | not)
            | "| \(.ecosystem) | \(.name) | \(.version) | [\(.id)](https://osv.dev/vulnerability/\(.id)) |"
          ')

          # mise audit が調べられないツール（unchecked）は、脆弱性があっても報告されない。
          # backend を変えたり別名を付けたりして検査を逃れられないよう、ベースで調べられないツールのほかは失敗にする。
          unchecked=$(jq -rn \
            --slurpfile mise_base "$RUNNER_TEMP/base-mise.json" \
            --slurpfile mise_head "$RUNNER_TEMP/head-mise.json" '
            ($mise_base[0].unchecked // [] | map(.tool)) as $known
            | ($mise_head[0].unchecked // [])[]
            | select(.tool as $t | any($known[]; . == $t) | not)
            | "| \(.tool) | \(.version) |"
          ')

          status=0
          if [ -n "$new" ]; then
            {
              echo "## New vulnerabilities"
              echo
              echo "| Ecosystem | Package | Version | ID |"
              echo "| --- | --- | --- | --- |"
              echo "$new"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            status=1
          fi

          if [ -n "$unchecked" ]; then
            {
              echo "## Tools not checked by mise audit"
              echo
              echo "mise audit cannot check these tools, which are new or were checked on the base branch. Use a backend that mise audit supports."
              echo
              echo "| Tool | Version |"
              echo "| --- | --- |"
              echo "$unchecked"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            status=1
          fi

          if [ "$status" -eq 0 ]; then
            echo "No new vulnerabilities found." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
