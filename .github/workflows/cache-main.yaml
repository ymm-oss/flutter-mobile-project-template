name: cache-main

# PR と merge queue のキャッシュは後の実行から読めないため、既定ブランチで作っておく
on:
  push:
    branches:
      - main
    paths:
      - "**.dart"
      - "**.yaml"
      - "**/pubspec.lock"
      - "mise.toml"
      - "mise.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  diff-gen:
    uses: ./.github/workflows/wc-check-diff.yaml
    permissions:
      contents: read
