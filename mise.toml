# mise release used in CI when this was set; it enforces mise.lock checksums for every backend.
min_version = "2026.10.25"

[tools]
bun = "1.4.4"
flutter = "3.47.9"
dprint = "0.49.1"
jq = "1.8.2"
zizmor = "1.32.0"
osv-scanner = "2.7.1"
gitleaks = "8.30.1"
java = "temurin-25.0.5+8.0.LTS"
"aqua:OpenAPITools/openapi-generator" = "7.27.0"

[settings]
# Platforms recorded in mise.lock: CI runners, Linux arm64, and Apple Silicon / Intel Macs.
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

[tasks.bootstrap]
description = "Initialize the workspace."
run = './tools/bootstrap.sh'
alias = "bs"

[tasks.clean]
description = "Clean this workspace."
run = [
  'bun run clean',
  'dart run melos clean',
]

[tasks.cspell]
description = "Run cspell to check spelling."
run = [
  'bun --bun run cspell lint',
]

# The tasks below are the entry points for people and AI agents.
# They call the melos scripts in pubspec.yaml; keep this list short.
# Arguments after the task name are passed to its command.
[tasks.analyze]
description = "Analyze all packages, or only the given files or directories. Fails on infos, as CI does."
run = 'dart analyze --fatal-infos'

[tasks.format]
description = "Format all packages, excluding generated code."
run = 'dart run melos run format --no-select'

[tasks.gen]
description = "Generate code with build_runner and slang."
run = 'dart run melos run gen --no-select'

[tasks.test]
description = "Run the tests of all packages, or only the given test files or directories."
run = './tools/test.sh'

# The one command to run before finishing work. It formats first, rewriting files,
# so that formatting cannot be forgotten. It does not regenerate code: run gen for that.
[tasks.check]
description = "Run before finishing work: format (rewrites files), then analyze, check dependency cycles and test."
run = [
  'dart run melos run format --no-select',
  'dart analyze --fatal-infos',
  'dart run melos list --cycles',
  'dart run melos run test --no-select',
]
