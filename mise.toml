# mise release used in CI when this was set; it enforces mise.lock checksums for every backend.
min_version = "2026.10.25"

[tools]
bun = "1.2.10"
flutter = "3.47.9"
dprint = "0.49.1"

[settings]
# Platforms recorded in mise.lock: CI runners, Linux arm64, and Apple Silicon / Intel Macs.
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

[tasks.bootstrap]
description = "Initialize the workspace."
run = './tools/bootstrap.sh'
alias = "bs"

[tasks.clean]
description = "Clean this workspace."
run = [
  'bun run clean',
  'dart run melos clean',
]

[tasks.cspell]
description = "Run cspell to check spelling."
run = [
  'bun run cspell lint',
]
