include: package:yumemi_lints/flutter/3.35/recommended.yaml

analyzer:
  errors:
    # https://pub.dev/packages/freezed#install
    invalid_annotation_target: ignore

plugins:
  # https://pub.dev/packages/riverpod_lint#installing-riverpod_lint
  # plugin は pubspec.lock で固定されないため、環境ごとに結果が変わらないよう完全なバージョンを指定する
  riverpod_lint: 3.1.9
